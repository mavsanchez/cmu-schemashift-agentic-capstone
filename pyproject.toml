[project]
name = "schemashift"
version = "0.1.0"
description = "Local-first multi-agent SQL schema migration capstone"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "gradio>=6,<7",
    "langchain-core>=1.2,<2",
    "langchain-ollama>=1,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-redis>=0.5,<0.6",
    "mcp>=2.1,<3",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=6,<7",
    "sqlglot>=28,<29",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemashift"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires local infrastructure such as PostgreSQL or Redis",
    "live: requires local Ollama models",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/schemashift/ui/pipeline.py" = ["E501"]
"src/schemashift/ui/styles.py" = ["E501"]
